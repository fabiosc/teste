name: hls-video-player
services:
- name: web
  source_dir: /
  github:
    repo: fabiosc/teste
    branch: main
    deploy_on_push: true
  run_command: echo "Static site - no build needed"
  environment_slug: html
  instance_count: 1
  instance_size_slug: basic-xxs
  routes:
  - path: /
  static_sites:
  - name: hls-player-static
    source_dir: /
    index_document: index.html
    error_document: index.html
    build_command: ""
    output_dir: /